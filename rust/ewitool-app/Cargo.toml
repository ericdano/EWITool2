[package]
name = "ewitool-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cpal = "0.18"
directories = "6.0.0"
eframe = "0.37.0"
ewitool-core = { path = "../ewitool-core" }
ewitool-synth = { path = "../ewitool-synth" }
fastrand = "2.5.0"
midir = "0.11.1"
rfd = "0.18.0"

[[bin]]
name = "ewitool2"
path = "src/main.rs"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }
fastrand = "2.5.0"
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

[build-dependencies]
embed-resource = "3.0.12"
